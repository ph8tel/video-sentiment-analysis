services:

  ffmpeg-overlay:
    build:
      context: ./services/ffmpeg-overlay
    ports:
      - "8001:8001"
    environment:
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-500}
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  sentiment-scoring:
    build:
      context: ./services/sentiment-scoring
    ports:
      - "8002:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      EMOTION_MODEL: ${EMOTION_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  media-ingest:
    build:
      context: ./services/media-ingest
    ports:
      - "8003:8003"
    environment:
      WHISPER_URL: ${WHISPER_URL:-http://192.168.1.188:5000}
      PYANNOTE_URL: ${PYANNOTE_URL:-http://192.168.1.188:3003}
      NUM_SPEAKERS: ${NUM_SPEAKERS:-2}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-500}
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: ./services/dashboard
    ports:
      - "3000:80"
    depends_on:
      ffmpeg-overlay:
        condition: service_healthy
      sentiment-scoring:
        condition: service_healthy
      media-ingest:
        condition: service_healthy
    restart: unless-stopped
