services:

  ffmpeg-overlay:
    build:
      context: ./services/ffmpeg-overlay
    ports:
      - "8001:8001"
    environment:
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-500}
    restart: unless-stopped

  sentiment-scoring:
    build:
      context: ./services/sentiment-scoring
    ports:
      - "8002:8002"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://192.168.1.108:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    restart: unless-stopped

  dashboard:
    build:
      context: ./services/dashboard
    ports:
      - "3000:80"
    restart: unless-stopped
